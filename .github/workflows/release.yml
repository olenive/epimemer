name: Release

# A tag `vX.Y.Z` builds the wheel, proves it installs, publishes it to
# TestPyPI, and then — after the `pypi` environment's approval — to PyPI.
# Both publish steps use PyPI's trusted publishing, so no token is stored.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must be the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag is $GITHUB_REF_NAME but pyproject.toml says $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: epimemer/visualization/frontend/package-lock.json
      - name: Build the visualization bundle
        working-directory: epimemer/visualization/frontend
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv build
      - run: uvx twine check dist/*

      - name: The wheel carries every package and the bundle
        run: |
          unzip -l dist/*.whl | grep -q 'epimemer/mcp/server.py'
          unzip -l dist/*.whl | grep -q 'epimemer/visualization/static/index.html'

      - name: Install into a clean environment, without the extra
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/epimemer --help
          smoke/bin/epimemer serve --help
          smoke/bin/python -c "import epimemer.mcp.server"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
