name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      # `--locked` refuses to run if pyproject.toml and uv.lock disagree, so a
      # dependency change that forgot to re-lock fails here rather than
      # resolving to something different on every machine.
      - run: uv sync --locked --extra dev --extra notebooks
      # The notebook suite renders Petri nets, and the `graphviz` extra is the
      # Python binding only — rendering needs the `dot` binary, which no extra
      # can supply. Without it five notebooks fail on a RuntimeError from the
      # first cell that renders, and the cells below them on the stub that
      # stands in for the value that cell never returned.
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv run --no-sync python -m pytest tests/ -q

  # Its own job rather than a step in the one above, because the environment is
  # the point: a plain install with no dev dependencies and no optional extra.
  # `tests/mcp/test_server_starts.py` launches the server too and runs in the
  # suite, but always from the development environment, and what went wrong was
  # an install that had everything except the `sentence-transformers` extra.
  server-starts:
    name: The server starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install the way a user does
        run: |
          uv venv clean-install
          uv pip install --python clean-install/bin/python -e .

      # In-memory storage and the mock embedding provider are the script's
      # defaults, so this downloads no model and opens no database. It completes
      # the MCP handshake over stdio, calls a tool, and checks the tool count
      # against the number INTEGRATION.md calls canonical.
      - name: It starts, and serves every tool
        run: clean-install/bin/python scripts/check_server_starts.py

      # The same install asked for the default provider, which it cannot build.
      # A client reports only that the connection failed, so what this proves is
      # that the log file holds the reason. The grep is deliberately separate:
      # it is the user's own way of reading that file.
      - name: Without the extra, the log file says why it did not
        env:
          EPIMEMER_EMBEDDING_PROVIDER: sentence-transformers
          EPIMEMER_LOG_FILE: startup-failure.log
        run: |
          clean-install/bin/python scripts/check_server_starts.py --expect-failure
          grep -q "failed to start" "$EPIMEMER_LOG_FILE"

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  frontend:
    name: Visualization frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epimemer/visualization/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: epimemer/visualization/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The bundle is never committed, so this is the only place it is proven
      # to build before the release workflow needs it.
      - run: npm run build

  integration:
    name: SurrealDB integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --extra dev
      # The same target a developer runs: a throwaway server for the ws://
      # suite, and the durability suite starts and restarts its own.
      - run: make test-integration
