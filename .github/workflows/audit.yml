name: Dependency advisories

# **The only thing watching this project's Python dependencies.** Dependabot's
# `pip` ecosystem does not read `uv.lock` and neither does the dependency graph,
# so no alert fires and no pull request is opened however old the lock gets.
# Measured once, on 2026-09-07: 19 of 132 installed packages carried an
# advisory, one of them critical, and nothing had said so.
#
# Weekly rather than on every push, because a new advisory is published against
# code that has not changed: the trigger is the calendar, not the commit.
#
# **A finding becomes an issue, not a failed run.** A failed scheduled job is an
# email that ages out of an inbox; an issue survives, can be assigned, and can
# be closed by the run that finds the problem gone. Nothing here opens a pull
# request or edits `uv.lock`: the update stays a deliberate act.

on:
  schedule:
    # Mondays, early. Nothing depends on the exact hour.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_TITLE: Dependency advisories
  ISSUE_LABEL: dependencies

jobs:
  audit:
    name: OSV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
      # Every extra, because an advisory against a package only the notebooks
      # pull in is still an advisory against something this repository installs.
      - run: uv sync --locked --extra dev --extra notebooks --extra sentence-transformers

      # The default bar is any advisory at all. Raise it with `--fail-on high`
      # if the low-severity findings ever become noise, and read the script's
      # docstring first: a finding is not a verdict, and most of the 19 were in
      # code paths this server never reaches.
      - id: audit
        continue-on-error: true
        run: |
          set +e
          uv run --no-sync python scripts/audit_dependencies.py > advisories.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat advisories.txt

      # Exit 2 is the check itself failing, an unreachable OSV or a changed
      # response shape. That says nothing about this environment, so it fails
      # the run rather than being filed as a vulnerability.
      - name: The check has to have run
        if: steps.audit.outputs.status == '2'
        run: |
          echo "::error::the advisory check could not complete"
          exit 1

      - name: Find the standing issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Silent on a week that changes nothing: an existing issue has its body
      # replaced with the current findings rather than gaining a comment, so
      # the issue is always what is true now and notifies only when it opens.
      - name: Open or refresh the issue
        if: steps.audit.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          {
            echo "\`scripts/audit_dependencies.py\` found packages with a published advisory."
            echo
            echo '```'
            cat advisories.txt
            echo '```'
            echo
            echo "A finding names an affected version, not a reachable code path."
            echo "Fix with \`uv lock --upgrade\` (or \`--upgrade-package <name>\`), then run the suite."
            echo
            echo "Refreshed by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > issue-body.md

          gh label create "$ISSUE_LABEL" --description "Dependency updates and advisories" --color ededed || true
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file issue-body.md
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file issue-body.md
          fi

      - name: Close the issue once nothing is affected
        if: steps.audit.outputs.status == '0' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.existing.outputs.number }}
        run: |
          gh issue close "$NUMBER" \
            --comment "No installed package carries a published advisory as of this run."
