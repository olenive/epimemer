[project]
name = "epimemer"
version = "0.1.0"
description = "Layered epistemic memory system"
readme = "SUMMARY.md"
requires-python = ">=3.14"
dependencies = [
    "petritype",
    "pydantic>=2.12.5",
    "pydantic-ai>=1.70.0",
    "surrealdb>=1.0.8",
    "sentence-transformers>=5.3.0",
    "marimo>=0.13.0",
    "fastmcp>=3.1.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
    "aiohttp>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
epimemer-viz = "epimemer.visualization.hub:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epimemer"]

[tool.uv.sources]
petritype = { path = "../petritype", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.marimo.display]
theme = "dark"
