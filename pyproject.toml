[project]
name = "epimemer"
version = "0.3.1"
description = "Epistemic memory for AI agents over MCP: a typed graph of claims with provenance, metacontexts, validity in time, and a review loop"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleg Lenive" }]
keywords = ["mcp", "memory", "knowledge-graph", "agents", "epistemic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "petritype>=0.3.1",
    "numpy>=2.0",
    "pydantic>=2.12.5",
    "surrealdb>=1.0.8",
    # Floor is the release that fixed the OAuth-proxy and OpenAPI-provider
    # advisories, not the version we test against, which the lock file pins.
    "fastmcp>=3.2.0",
    # Floor is the release that fixed the `request.form()` limit bypass and
    # the StaticFiles UNC path traversal.
    "starlette>=1.3.1",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
    # One code path for every backup destination. Core rather than an extra
    # because it is pure Python with no dependencies of its own, and because a
    # local path has to work out of the box: the cloud drivers are the heavy
    # part, and they are the extras below.
    "fsspec>=2024.6.0",
    # Calendar recurrence rules ("the second Tuesday of every month") are RFC
    # 5545 strings, and this is what reads them. Core rather than transitive:
    # it arrives today only under the s3 extra, so relying on
    # that copy would make calendar rules work on a developer's machine and
    # fail on a plain `pip install epimemer`. Pure Python, one requirement.
    "python-dateutil>=2.9.0",
    # Named here although it arrives through httpx and requests, so that the
    # floor holds: the release that dropped the emSign root whose intermediate
    # keys were disclosed in October 2026. botocore falls back to its own
    # bundle only when certifi is absent, so the floor reaches the s3 extra.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
# The default embedding provider, kept optional because it brings PyTorch with
# it. Selecting it without this extra installed refuses at startup and names
# the extra.
sentence-transformers = [
    "sentence-transformers>=5.3.0",
]
# Backup destinations. Neither is a default dependency: most users back up to a
# folder, and each of these brings a cloud SDK with it. Credentials come from
# each provider's own standard chain, so nothing here is configured in Epimemer.
gcs = [
    "gcsfs>=2024.6.0",
]
s3 = [
    "s3fs>=2024.6.0",
]
# The Postgres storage backend's driver, with its compiled libpq wheel. Not a
# default dependency: a compiled driver nobody asked for is how a plain install
# breaks. Selecting the backend without this extra refuses at startup and
# names the extra.
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/olenive/epimemer"
Repository = "https://github.com/olenive/epimemer"
Issues = "https://github.com/olenive/epimemer/issues"
Changelog = "https://github.com/olenive/epimemer/blob/main/CHANGELOG.md"

[project.scripts]
epimemer = "epimemer.cli:main"
epimemer-viz = "epimemer.visualization.hub:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["epimemer*"]

# The visualization bundle is build output, produced by `npm run build` under
# epimemer/visualization/frontend and never committed. The release workflow
# builds it before `uv build`, so the wheel carries it; a wheel built from a
# bare checkout serves the hub's API without the page.
[tool.setuptools.package-data]
"epimemer.visualization" = ["static/*", "static/assets/*"]
# The agent guidance ships with the package: INTEGRATION.md tells a reader
# to open it, and 0.1.0 shipped without it. The directory is already found
# by packages.find; without this line it contributes no files.
epimemer_prompts = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Defaults plus import order, bugbear, and pyupgrade. Anything beyond these
# has to earn its place by catching something real here.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # `StrEnum` changes what `str()` and an f-string produce for a member —
    # `EdgeType.SIMILARITY` becomes `similarity` — and the `(str, Enum)` mixin
    # is what every serialised value and log line here was written against.
    "UP042",
    # A lambda bound to a name is the dispatch idiom in `cli.py`; a `def` for
    # each one-line branch is longer and says nothing more.
    "E731",
]
