[project]
name = "epimemer"
version = "0.1.1"
description = "Epistemic memory for AI agents over MCP: a typed graph of claims with provenance, frames, validity in time, and a review loop"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oleg Lenive" }]
keywords = ["mcp", "memory", "knowledge-graph", "agents", "epistemic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "petritype>=0.1.1",
    "numpy>=2.0",
    "pydantic>=2.12.5",
    "surrealdb>=1.0.8",
    "fastmcp>=3.1.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
# The default embedding provider, kept optional because it brings PyTorch with
# it. Selecting it without this extra installed refuses at startup and names
# the extra.
sentence-transformers = [
    "sentence-transformers>=5.3.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16",
]
# Everything the marimo notebooks under notebooks/ need. `marimo` lived in the
# runtime dependencies until nothing outside notebooks/ turned out to import
# it, which made it a demo dependency shipped to every install.
# `petritype[examples]` rather than naming rustworkx and matplotlib directly:
# those are petritype's requirements for its graph and plotting modules, so
# listing them here would go stale the next time it moves.
# `graphviz` is the Python binding only. Rendering also needs the Graphviz
# system binaries (`dot`) — `brew install graphviz` — which no extra can supply.
notebooks = [
    "marimo>=0.13.0",
    "petritype[examples]",
    "graphviz>=0.20",
]

[project.urls]
Homepage = "https://github.com/olenive/epimemer"
Repository = "https://github.com/olenive/epimemer"
Issues = "https://github.com/olenive/epimemer/issues"
Changelog = "https://github.com/olenive/epimemer/blob/main/CHANGELOG.md"

[project.scripts]
epimemer = "epimemer.cli:main"
epimemer-viz = "epimemer.visualization.hub:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["epimemer*"]

# The visualization bundle is build output, produced by `npm run build` under
# epimemer/visualization/frontend and never committed. The release workflow
# builds it before `uv build`, so the wheel carries it; a wheel built from a
# bare checkout serves the hub's API without the page.
[tool.setuptools.package-data]
"epimemer.visualization" = ["static/*", "static/assets/*"]
# The agent guidance ships with the package: INTEGRATION.md tells a reader
# to open it, and 0.1.0 shipped without it. The directory is already found
# by packages.find; without this line it contributes no files.
epimemer_prompts = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.marimo.display]
theme = "dark"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Defaults plus import order, bugbear, and pyupgrade. Anything beyond these
# has to earn its place by catching something real here.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # `StrEnum` changes what `str()` and an f-string produce for a member —
    # `EdgeType.SIMILARITY` becomes `similarity` — and the `(str, Enum)` mixin
    # is what every serialised value and log line here was written against.
    "UP042",
    # A lambda bound to a name is the dispatch idiom in `cli.py`; a `def` for
    # each one-line branch is longer and says nothing more.
    "E731",
]

[tool.ruff.lint.per-file-ignores]
# A marimo cell displays its trailing expression; that is the output, not a
# useless statement.
"notebooks/*" = ["B018"]
