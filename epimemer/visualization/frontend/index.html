<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epimemer — Live Visualization</title>
  </head>
  <body class="h-full bg-gray-950 text-gray-200 overflow-hidden">
    <div id="app" class="flex flex-col h-full">
      <!-- Header -->
      <header class="flex items-center justify-between px-4 py-2 border-b border-gray-800 bg-gray-900 shrink-0">
        <div class="flex items-center gap-3">
          <h1 class="text-sm font-semibold tracking-wide text-gray-300">Epimemer</h1>
          <div class="flex items-center gap-1.5 text-xs">
            <span class="text-gray-500">Session:</span>
            <select id="session-selector" class="text-xs bg-gray-800 text-gray-300 rounded px-1.5 py-0.5 border border-gray-700" title="MCP session to view">
              <option value="">No sessions</option>
            </select>
          </div>
          <div class="flex items-center gap-1.5 text-xs text-gray-500">
            <span>MCP:</span>
            <span id="mcp-active-graph" class="text-gray-400" title="active graph (backend) of the selected session">-</span>
            <span id="reflect-badge" class="px-1.5 py-0.5 rounded text-xs bg-gray-800 text-gray-600" title="Reflection pressure not yet known for this session">reflect —</span>
          </div>
          <div class="flex items-center gap-1.5 text-xs">
            <span class="text-gray-500">Viewing:</span>
            <select id="graph-selector" class="text-xs bg-gray-800 text-gray-300 rounded px-1.5 py-0.5 border border-gray-700">
              <option value="">Loading...</option>
            </select>
            <span id="view-mode-badge" class="px-1.5 py-0.5 rounded text-xs bg-gray-700 text-gray-400">-</span>
            <button id="btn-refresh" class="px-1.5 py-0.5 text-xs rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors" title="Refresh snapshot">Refresh</button>
          </div>
        </div>
        <div class="flex gap-2">
          <button id="btn-toggle-pipeline" class="px-2 py-1 text-xs rounded bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors" title="Toggle pipeline strip">Pipelines</button>
          <span id="ws-status" class="px-2 py-1 text-xs rounded bg-red-900/50 text-red-400">Disconnected</span>
        </div>
      </header>

      <!-- Knowledge graph (the star) — relative so the pipeline detail can overlay it -->
      <div class="relative flex-1 min-h-0">
        <div id="panel-graph" class="flex flex-col h-full min-w-0">
          <div class="flex items-center justify-between px-3 py-1.5 bg-gray-900/50 border-b border-gray-800 shrink-0">
            <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">Knowledge Graph</span>
            <div class="flex gap-1.5">
              <select id="graph-layout" class="text-xs bg-gray-800 text-gray-400 rounded px-1.5 py-0.5 border border-gray-700">
                <option value="dagre">Hierarchy</option>
                <option value="fcose">Force</option>
              </select>
              <select id="graph-filter" class="text-xs bg-gray-800 text-gray-400 rounded px-1.5 py-0.5 border border-gray-700">
                <option value="all">All types</option>
                <option value="topic">Topics</option>
                <option value="fact">Facts</option>
                <option value="inference">Inferences</option>
              </select>
            </div>
          </div>
          <div id="graph-container" class="flex-1 min-h-0"></div>
        </div>

        <!-- Pipeline detail overlay (opens over the graph on tile click) -->
        <div id="pipeline-detail" class="hidden absolute inset-0 z-20 flex flex-col bg-gray-950/95 backdrop-blur-sm">
          <div class="flex items-center justify-between px-3 py-1.5 border-b border-gray-800 bg-gray-900">
            <span id="pipeline-detail-title" class="text-xs font-medium text-gray-300"></span>
            <button id="pipeline-detail-close" class="text-gray-500 hover:text-gray-300 text-lg leading-none px-1" title="Close (Esc)">&times;</button>
          </div>
          <div id="pipeline-detail-svg" class="flex-1 min-h-0 overflow-auto p-3"></div>
        </div>
      </div>

      <!-- Node detail drawer (graph node click) -->
      <div id="detail-drawer" class="hidden border-t border-gray-800 bg-gray-900 shrink-0 max-h-48 overflow-auto">
        <div class="flex items-center justify-between px-3 py-1.5 border-b border-gray-800">
          <span id="detail-title" class="text-xs font-medium text-gray-400"></span>
          <button id="btn-close-detail" class="text-xs text-gray-600 hover:text-gray-400">&times;</button>
        </div>
        <pre id="detail-content" class="px-3 py-2 text-xs text-gray-400 whitespace-pre-wrap"></pre>
      </div>

      <!-- Pipeline strip (ambient awareness) -->
      <div id="pipeline-strip-wrap" class="shrink-0 border-t border-gray-800 bg-gray-900">
        <div class="flex items-center justify-between px-3 py-1 border-b border-gray-800/50">
          <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">Pipelines</span>
          <span id="pipeline-strip-hint" class="text-xs text-gray-600">Run a tool to see pipelines</span>
        </div>
        <div id="pipeline-strip" class="flex gap-2 overflow-x-auto p-2" style="min-height: 5.5rem"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
